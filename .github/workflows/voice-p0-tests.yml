name: voice-p0-tests

on:
  pull_request:
    paths:
      - 'algorithm-service/tests/fake-runner-p0.py'
      - 'algorithm-service/tests/test_fake_runner_p0.py'
      - 'docs/voice-control-p0/**'
      - '.github/workflows/voice-p0-tests.yml'
  push:
    branches:
      - main
      - 'lyj/**'

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algorithm-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install P0 test dependency
        run: python -m pip install -r tests/requirements-p0.txt
      - name: Run deterministic Fake Runner tests
        run: python -m pytest tests/test_fake_runner_p0.py -q
